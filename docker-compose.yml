# dùng để chạy nhiều container cùng lúc.

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pg_nestjs_ecommerce
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecommerce_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nestjs_ecommerce_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${APP_PORT}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce_net

volumes:
  postgres_data:

networks:
  ecommerce_net:
    driver: bridge
